# wwand-ims-vowifi: the charon settings its vici interface cannot carry,
# for our connections only (vowifi/tunnel.uc, loaded over vici at run time;
# one per IMS line: wwand-vowifi, wwand-vowifi1, ...). Installed as
# /etc/strongswan.d/charon/wwand-ims-vowifi.conf.
# - p-cscf: asks the ePDG for P-CSCF addresses (RFC 7651);
# - epdg-idr (the feed's strongswan): accepts the identity the ePDG answers
#   with although the IMS APN was sent as IDr (TS 24.302 7.2.2).
# This file is read inside charon's `plugins` section; charon's own
# settings are in wwand-ims-vowifi-ike.conf (/etc/strongswan.d/).
# Four lines are named here; a fifth needs its name added.
p-cscf {
	enable {
		wwand-vowifi = yes
		wwand-vowifi1 = yes
		wwand-vowifi2 = yes
		wwand-vowifi3 = yes
	}
}
epdg-idr {
	connections = wwand-vowifi, wwand-vowifi1, wwand-vowifi2, wwand-vowifi3
}
