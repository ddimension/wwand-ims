# wwand-ims-vowifi: the one charon setting its vici interface cannot carry.
# The p-cscf plugin asks the ePDG for P-CSCF addresses (RFC 7651) only for
# connections named here; the connection itself is loaded over vici at run
# time (vowifi/tunnel.uc, CONN). Installed as
# /etc/strongswan.d/charon/wwand-ims-vowifi.conf, merged into the p-cscf
# plugin's section.
p-cscf {
	enable {
		wwand-vowifi = yes
	}
}
