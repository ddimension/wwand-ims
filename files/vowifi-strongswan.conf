# wwand-ims-vowifi: the charon settings its vici interface cannot carry,
# for our connection only (vowifi/tunnel.uc CONN, loaded over vici at run
# time). Installed as /etc/strongswan.d/charon/wwand-ims-vowifi.conf.
# - p-cscf: asks the ePDG for P-CSCF addresses (RFC 7651);
# - epdg-idr (the feed's strongswan): accepts the identity the ePDG answers
#   with although the IMS APN was sent as IDr (TS 24.302 7.2.2).
p-cscf {
	enable {
		wwand-vowifi = yes
	}
}
epdg-idr {
	connections = wwand-vowifi
}
