# wwand-ims-vowifi: charon settings its vici interface cannot carry.
# Installed as /etc/strongswan.d/wwand-ims-vowifi.conf; they apply to every
# connection of this charon, not only the VoWiFi tunnel.
#
# The tunnel ends on an XFRM interface (if_id) in the IMS VRF, and
# wwand-ims-vowifi puts the inner address and the route there itself
# (vowifi/ctl.uc). Without these charon installed the virtual IP a second
# time on the LAN bridge and its policy routing rule (table 220) next to it
# (HW, NR7101, 2026-11-21).
charon {
	install_virtual_ip = no
	install_routes = no
}
