# wwand-ims-vowifi: charon's own settings, installed as
# /etc/strongswan.d/wwand-ims-vowifi-ike.conf (read at the top level of
# strongswan.conf; the plugin settings are in charon/wwand-ims-vowifi.conf).
# Retransmissions: an IKE request (DPD among them) is given up after ~26 s
# (2 s, x1.5, 4 retransmissions) instead of charon's ~165 s, so a tunnel
# that died quietly goes down within ~50 s with the 20 s DPD
# (vowifi/tunnel.uc) and the IMS line takes its fallback. This applies to
# every connection of this charon.
charon {
	retransmit_tries = 4
	retransmit_timeout = 2.0
	retransmit_base = 1.5
}
