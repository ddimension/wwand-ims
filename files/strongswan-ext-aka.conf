# the EAP-AKA card that runs AUTHENTICATE elsewhere (wwand-ims:
# src/strongswan/ext_aka): the USIM in a modem or a card reader, through
# /usr/libexec/strongswan/ext-aka (vowifi/ext_aka.uc)
ext-aka {

    # whether to load the plugin
    load = yes

    # the program that runs the AKA: `<program> aka <identity> <RAND> <AUTN>`
    # program = /usr/libexec/strongswan/ext-aka
}
